name: Pruebas Java con Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn --batch-mode compile

      - name: Ejecutar programa Java
        run: |
          java -cp target/classes com.inventario.App

      - name: Ejecutar pruebas unitarias JUnit
        run: mvn --batch-mode test

      - name: Generar archivo JAR
        run: mvn --batch-mode package